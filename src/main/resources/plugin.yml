name: BoatJump
version: '${version}'
main: boatjump.BoatJumpPlugin
api-version: '26.3'
description: 보트가 얼음 턱을 자연스럽게 오르고, 마커 구역에서 가속하거나 튕깁니다.
commands:
  boatjump:
    description: 마커와 설정값, 보트가 뛰어넘을 블록을 관리합니다.
    usage: /boatjump
    permission: boatjump.admin
permissions:
  boatjump.admin:
    default: op
